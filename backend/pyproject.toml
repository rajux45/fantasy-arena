[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-arena-backend"
version = "0.1.0"
description = "Fantasy Arena backend (FastAPI + Celery + Postgres)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.1",
  "redis>=5.0.7",
  "celery[redis]>=5.4.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt==4.0.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "email-validator>=2.2.0",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "cryptography>=43.0.0",
  "qrcode>=7.4.2",
  "pyotp>=2.9.0",
  "razorpay>=1.4.2",
  "geoip2>=4.8.0",
  "reportlab>=4.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.4",
  "mypy>=1.11.2",
  "types-redis>=4.6.0",
  "freezegun>=1.5.1",
  "respx>=0.21.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "T20", "RUF"]
ignore = [
  "S101",   # asserts in tests
  "S104",   # bind 0.0.0.0 in dev
  "S105", "S106", "S107",  # password-as-string false positives
  "B008",   # FastAPI Depends(...) default
  "N806",   # local var capitalization (e.g., TestSession)
  "N811",   # SQLAlchemy `JSONB`/`UUID` aliasing
  "E402",   # module-level imports interleaved with constants
  "E701",   # one-liner conditionals are intentional in scoring engines
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20", "E501"]
"seed.py" = ["T20"]
"app/api/ws.py" = ["S110"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
