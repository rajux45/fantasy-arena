name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .
      - name: Tests (pytest)
        working-directory: backend
        env:
          ENV: test
          DATABASE_URL: sqlite+pysqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          SECRET_KEY: ci-test-secret-key
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Web typecheck
        run: pnpm --filter @fantasy-arena/web typecheck
      - name: Web lint
        run: pnpm --filter @fantasy-arena/web lint
      - name: Web build
        run: pnpm --filter @fantasy-arena/web build
      - name: Mobile typecheck
        run: pnpm --filter @fantasy-arena/mobile typecheck
      - name: Shared typecheck
        run: pnpm --filter @fantasy-arena/shared typecheck
