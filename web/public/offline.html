<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline · Fantasy Arena</title>
    <link rel="icon" href="/favicon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #0f172a;
        color: #f8fafc;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .badge {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 16px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
        color: #e2e8f0;
      }
      p {
        margin: 0 0 24px;
        color: #94a3b8;
        max-width: 36ch;
      }
      button {
        background: linear-gradient(135deg, #22d3ee, #10b981);
        color: #0f172a;
        font-weight: 600;
        font-size: 15px;
        padding: 12px 24px;
        border: 0;
        border-radius: 12px;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
      .links {
        margin-top: 24px;
        font-size: 13px;
        color: #64748b;
      }
      .links a {
        color: #22d3ee;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <span class="badge">Fantasy Arena</span>
      <h1>You&rsquo;re offline</h1>
      <p>
        Match cards, lobby, and contest joins need a network connection. Your wallet, deposits and
        withdrawals are also unavailable until you&rsquo;re back online.
      </p>
      <button onclick="location.reload()">Try again</button>
      <div class="links">
        <a href="/legal">Legal</a> &middot;
        <a href="/responsible">Responsible gaming</a>
      </div>
    </div>
  </body>
</html>
